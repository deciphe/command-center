name: Fix Derived Recoup
on:
  push:
    paths:
      - '.github/workflows/fix-derived-recoup.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace selectable recoup with derived first payout
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text()

          s = s.replace('let sale=false,refund=false,modePct=100,book=[];', 'let sale=false,refund=false,book=[];')

          funded = '''<div class="funded"><div class="step">02 — Funded</div><div class="fundedTitle">First payout recoup.</div><div class="hint">This target is solved automatically from funded acquisition cost and payout split. There is no recoup-speed or hedge-distance choice.</div><div class="fields"><div class="field"><label>Profit split %</label><input id="split" class="input" type="number" value="95"></div><div class="field"><label>Target net after recoup</label><input id="targetNet" class="input" type="number" value="0"></div></div><div class="recoup"><div><span class="label">Required funded profit</span><strong id="requiredGross">—</strong></div><div id="recoupText" class="recoupCopy"></div></div><div class="toggleRow"><button id="refundBtn" class="chip refund" type="button">Refund</button></div><div id="refundBox" class="conditional"><div class="fields" style="margin-top:0"><div class="field"><label>Refund amount</label><input id="refundAmount" class="input" type="number"></div><div class="field"><label>Refund applied</label><input id="refundShown" class="input" readonly></div></div></div><div class="stats"><div class="stat"><span>Acquisition</span><b id="fundedAcq">—</b></div><div class="stat"><span>Funded hedge</span><b id="fundedHedge">—</b></div><div class="stat"><span>Full hedge exposure</span><b id="fullExposure">—</b></div><div class="stat"><span>Payout after split</span><b id="requiredPayout">—</b></div><div class="stat"><span>Refund</span><b id="refundMetric">—</b></div><div class="stat"><span>Net after recoup</span><b id="netAfter">—</b></div></div><div class="summary"><span class="label">Recoup path</span><div id="heroLine" class="summaryLine"></div></div><button id="saveEntry" class="btn primary" type="button" style="width:100%;margin-top:12px">Save setup</button></div>'''

          s, n = re.subn(r'<div class="funded"><div class="step">02 — Funded</div>.*?</div></aside>', funded + '</aside>', s, count=1, flags=re.S)
          assert n == 1, 'funded UI replacement failed'

          old_head = '<thead><tr><th>Firm / Plan</th><th>Size</th><th>List</th><th>Sale</th><th>Acq cost</th><th>DD</th><th>Hedge distance</th><th>Final hedge</th><th>Payout</th><th>Refund</th><th>Net</th><th></th><th></th></tr></thead>'
          new_head = '<thead><tr><th>Firm / Plan</th><th>Size</th><th>List</th><th>Sale</th><th>Acq cost</th><th>Full hedge</th><th>Split</th><th>First payout gross</th><th>Refund</th><th>Target net</th><th></th><th></th></tr></thead>'
          assert old_head in s, 'book header not found'
          s = s.replace(old_head, new_head, 1)

          s, n = re.subn(r'function setMode\(pct\)\{.*?\}function calc\(\)', 'function calc()', s, count=1, flags=re.S)
          assert n == 1, 'setMode removal failed'

          calc_block = r'''function calc(){const a=acquisition();$('acqCost').textContent=M(a.acq);$('acqSummary').innerHTML=(sale?`<span class="strike">${M(a.list)}</span> <span class="saleprice">${M(a.base)}</span> purchase`:M(a.base)+' purchase')+` → ${M(a.acq)} funded acquisition`;$('ddDollar').textContent=M(a.ddDollar);$('ddRatio').textContent=a.acq?(a.ddDollar/a.acq).toFixed(2)+'×':'—';$('costMultiple').textContent=a.start?(a.acq/a.start).toFixed(2)+'×':'—';$('flow').innerHTML=a.stages.map((v,i)=>`<span class="flowPill">${M(v)}</span>${i<a.stages.length-1?'<span class="arrow">→</span>':''}`).join('');if(refund&&!$('refundAmount').dataset.touched)$('refundAmount').value=a.base.toFixed(2);calcFunded(a)}function calcFunded(a=acquisition()){const splitPct=Math.min(100,N('split')),split=splitPct/100,targetNet=N('targetNet'),fundedHedge=a.acq,fullExposure=a.acq+fundedHedge,refundAmt=refund?($('refundAmount').value.trim()?N('refundAmount'):a.base):0,requiredPayout=Math.max(0,fullExposure+targetNet-refundAmt),requiredGross=split>0?requiredPayout/split:0,net=requiredGross*split+refundAmt-fullExposure;$('requiredGross').textContent=split>0?M(requiredGross):'Set split';$('recoupText').textContent=split>0?`${M(a.acq)} acquisition + ${M(fundedHedge)} funded hedge = ${M(fullExposure)} full exposure. At ${splitPct.toFixed(1)}% split, the funded account must make ${M(requiredGross)} gross for the payout to return ${M(requiredPayout)}.`:'Choose a profit split above 0% to solve the first payout target.';$('fundedAcq').textContent=M(a.acq);$('fundedHedge').textContent=M(fundedHedge);$('fullExposure').textContent=M(fullExposure);$('requiredPayout').textContent=M(requiredPayout);$('refundMetric').textContent=refund?M(refundAmt):'Off';$('refundShown').value=M(refundAmt);$('netAfter').textContent=(net>=0?'+':'')+M(net);$('heroLine').innerHTML=`<span class="g">${M(a.acq)}</span> acquisition + <span class="p">${M(fundedHedge)}</span> funded hedge = ${M(fullExposure)} exposure → ${splitPct.toFixed(1)}% split → <span class="g">${split>0?M(requiredGross):'—'}</span> gross → ${M(requiredPayout)} payout${refund?` + ${M(refundAmt)} refund`:''}`;return{...a,fundedHedge,fullExposure,requiredPayout,requiredGross,gross:requiredGross,split:splitPct,payout:requiredPayout,refundAmt,targetNet,net}}function esc(s)'''
          s, n = re.subn(r'function calc\(\)\{.*?\}function esc\(s\)', calc_block, s, count=1, flags=re.S)
          assert n == 1, 'calculator logic replacement failed'

          load_block = r'''function loadEntry(id){const x=book.find(v=>v.id===id);if(!x)return;$('firm').value=x.firm||'';$('plan').value=x.plan||'';$('account').value=x.account||0;$('fee').value=x.list??x.fee??0;$('addon').value=x.addon||0;$('dd').value=x.dd||8;$('discount').value=x.discount||0;sale=!!x.sale;$('saleBtn').classList.toggle('active',sale);$('saleBox').classList.toggle('show',sale);setPhases(x.phases||[8,4]);$('notes').value=x.notes||'';$('split').value=x.split||95;$('targetNet').value=x.targetNet||0;refund=!!x.refund;$('refundBtn').classList.toggle('active',refund);$('refundBox').classList.toggle('show',refund);$('refundAmount').value=x.refundAmt||0;if(refund)$('refundAmount').dataset.touched='1';calc();$('calculatorTop').scrollIntoView({behavior:'smooth',block:'start'});status('Loaded · '+esc(x.firm||'setup'))}'''
          s, n = re.subn(r'function loadEntry\(id\)\{.*?\}function renderBook\(\)', load_block + 'function renderBook()', s, count=1, flags=re.S)
          assert n == 1, 'loadEntry replacement failed'

          render_block = r'''function renderBook(){$('empty').style.display=book.length?'none':'block';$('bookBody').innerHTML=book.map(x=>{const full=x.fullExposure??x.total??((x.acq||0)*2),gross=x.requiredGross??x.gross??0;return `<tr class="entry" data-id="${x.id}"><td><b>${esc(x.firm)}</b><div class="sub">${esc(x.plan)}</div></td><td class="num">${M(x.account)}</td><td class="num">${M(x.list??x.fee)}</td><td class="num">${x.sale?M(x.base):'—'}</td><td class="num">${M(x.acq)}</td><td class="num">${M(full)}</td><td class="num">${Number(x.split||0).toFixed(1)}%</td><td class="num"><b>${M(gross)}</b></td><td class="num">${x.refund?M(x.refundAmt):'—'}</td><td class="num">${M(x.targetNet||0)}</td><td><button class="btn mini load" type="button" data-load="${x.id}">Load</button></td><td><button class="btn danger mini del" type="button" data-del="${x.id}">×</button></td></tr>`}).join('');document.querySelectorAll('.entry').forEach(r=>r.addEventListener('click',e=>{if(e.target.closest('.del'))return;loadEntry(r.dataset.id)}));document.querySelectorAll('.del').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();book=book.filter(x=>x.id!==b.dataset.del);persist()}))}'''
          s, n = re.subn(r'function renderBook\(\)\{.*?\}function download\(', render_block + 'function download(', s, count=1, flags=re.S)
          assert n == 1, 'renderBook replacement failed'

          csv_block = r'''function exportCsv(){const c=['firm','plan','account','list','discount','base','acq','fundedHedge','fullExposure','split','requiredGross','requiredPayout','refundAmt','targetNet','net','notes'],q=v=>'"'+String(v??'').replace(/"/g,'""')+'"',csv=[c.join(','),...book.map(x=>c.map(k=>q(x[k])).join(','))].join('\n');download('gigaprop-hedge-book.csv',csv,'text/csv')}'''
          s, n = re.subn(r'function exportCsv\(\)\{.*?\}document\.querySelectorAll\(\'\.mode\[data-pct\]\'\).*?\$\(\'saleBtn\'\)', csv_block + "$('saleBtn')", s, count=1, flags=re.S)
          assert n == 1, 'old recoup event block replacement failed'

          s = s.replace("['grossProfit','split','targetNet','refundAmount'].forEach(id=>$(id).addEventListener('input',()=>{if(id==='grossProfit'||id==='refundAmount')$(id).dataset.touched='1';calcFunded()}));", "['split','targetNet','refundAmount'].forEach(id=>$(id).addEventListener('input',()=>{if(id==='refundAmount')$(id).dataset.touched='1';calcFunded()}));")
          s = s.replace("JSON.stringify({version:5,book}", "JSON.stringify({version:6,book}")

          # Formula sanity check from the user's example.
          acq, split = 591, .90
          assert abs((acq*2/split) - 1313.3333333333333) < 1e-9

          p.write_text(s)
          PY
      - name: Validate JavaScript and removed controls
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          assert 'Quick · 25%' not in s
          assert 'Half · 50%' not in s
          assert 'Full DD · 100%' not in s
          assert 'hedgeTarget' not in s
          assert 'hedgePct' not in s
          assert 'customMode' not in s
          assert 'requiredGross' in s
          m=re.search(r'<script>(.*)</script>',s,re.S)
          assert m
          Path('/tmp/script.js').write_text(m.group(1))
          PY
          node --check /tmp/script.js
      - name: Commit fix
        shell: bash
        run: |
          rm .github/workflows/fix-derived-recoup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-derived-recoup.yml
          git commit -m "Derive funded recoup target from acquisition and split"
          git push
