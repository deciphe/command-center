name: Move Hedge Command

on:
  push:
    paths:
      - '.github/workflows/move-hedge-command.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout command center
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve old command center
        run: cp index.html legacy-command-center.html

      - name: Copy exact validated hedge command
        run: curl -fsSL https://raw.githubusercontent.com/deciphe/thepayoutlab/main/public/gp-ops-7f3k/index.html -o index.html

      - name: Commit migrated page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html legacy-command-center.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Move hedge command to standalone Pages repo"
            git push
          fi
